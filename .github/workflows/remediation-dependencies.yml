name: Remediation dependency snapshot
on:
  push:
    branches: [quality-remediation-20260920]
    paths: [.github/workflows/remediation-dependencies.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Package dependency-only diagnostics
        run: |
          tar -czf /tmp/docurama-dependencies.tar.gz node_modules
          cp "$HOME/.bun/bin/bun" /tmp/docurama-bun
          sha256sum bun.lock > /tmp/docurama-lock.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: remediation-dependencies-${{ github.sha }}
          path: |
            /tmp/docurama-dependencies.tar.gz
            /tmp/docurama-bun
            /tmp/docurama-lock.sha256
          compression-level: 0
          retention-days: 1
