# Auth — forgot-password view: request a reset link and navigate back.
url: ${MAESTRO_BASE_URL}/login
name: Forgot password flow shows inbox confirmation
tags:
  - e2e
  - auth
---
- launchApp

- tapOn: Forgot password?

# Reset view with its own heading
- assertVisible: Reset your password

- tapOn:
    id: forgot-email
- inputText: e2e@docurama.eu
- tapOn: " ?Send reset link ?"

# Anti-enumeration confirmation (same screen whether or not the account exists)
- extendedWaitUntil:
    visible: Check your inbox
    timeout: 10000

# Back navigation returns to the password form
- tapOn: " ?Back to sign in ?"
- assertVisible: Sign in to your portal
