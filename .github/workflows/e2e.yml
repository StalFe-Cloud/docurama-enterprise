name: E2E

on:
  push:
    branches: [main, quality, quality-remediation-20260920]
  pull_request:
    branches: [main, quality, quality-remediation-20260920]
  workflow_dispatch:

permissions:
  contents: read

# Superseded commits must not keep consuming runners or produce misleading
# old-revision results while the pull request is being corrected.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - name: Check startup failure policy
        run: bash scripts/test-entrypoint.sh
      - name: Build production container
        run: docker build -t docurama-ci:${{ github.sha }} .
      - name: Check image content and boot with an empty scratch database
        run: |
          docker run --rm --entrypoint sh docurama-ci:${{ github.sha }} -c 'test ! -e /app/.env && test ! -e /app/.env.production && test -f /app/content/blog/docurama-is-live.md'
          docker run -d --name docurama-ci -p 127.0.0.1:3030:3000 -e DATABASE_URL=file:/app/db/smoke.db -e REKOR_WITNESS=off -e DOCURAMA_WORKER=off docurama-ci:${{ github.sha }}
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3030/api/health; then
              curl -fsS http://127.0.0.1:3030/blog | grep -F 'Docurama: sign documents and inspect recorded evidence' >/dev/null
              docker exec -e DOCURAMA_BOOTSTRAP_EMAIL=admin@container.test -e DOCURAMA_BOOTSTRAP_PASSWORD=DisposableContainerTest123 docurama-ci bun /app/bootstrap-admin.js --empty-installation
              exit 0
            fi
            sleep 3
          done
          docker logs docurama-ci
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs docurama-ci || true
      - name: Stop test container
        if: always()
        run: docker rm -f docurama-ci || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_DEMO_MODE: "true"
      DOCURAMA_ALLOW_PRIVATE_WEBHOOKS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Verify isolated lifecycle and security boundaries
        run: |
          node e2e/isolation.test.mjs
          node e2e/isolation-migrations.test.mjs
          node e2e/isolation-processes.test.mjs
          node e2e/isolation-lifecycle.test.mjs
          node e2e/seaweed-isolation.test.mjs
          bun --no-env-file test --timeout 90000 e2e/esign-preferences-concurrency.test.mjs
          bun --no-env-file test --timeout 90000 e2e/retention-fixture.test.mjs
          bun --no-env-file test --timeout 90000 e2e/signing-preflight-isolation.test.mjs
          for spec in e2e/consent.test.ts e2e/signing-assurance.test.ts e2e/mail-sender.test.ts e2e/mail-settings.test.ts e2e/storage-read-limits.test.ts; do
            bun --no-env-file test --timeout 30000 "$spec"
          done
          for spec in e2e/esign-preferences.test.ts e2e/request-origin.test.ts scripts/mfa-regression.test.ts e2e/admin-response-security.test.ts e2e/admin-route-security.test.ts e2e/signer-policy.test.ts e2e/evidence-assurance.test.ts e2e/contract-snapshot.test.ts e2e/final-document.test.ts e2e/signing-email.test.ts e2e/signing-email-smtp.test.ts e2e/mail-signing-gate.test.ts e2e/mail-completion-attachments.test.ts scripts/signing-workflow-regression.test.ts; do
            bun --no-env-file test "$spec"
          done
          bun --no-env-file scripts/mfa-sqlite-regression.ts

      - name: Verify core signature-hint field validation
        if: github.event.repository.name == 'docurama'
        run: |
          bun --no-env-file test e2e/envelope-fields.test.ts
          bun --no-env-file test e2e/envelope-field-routes.test.ts

      - name: Install Chrome + no-sandbox wrapper
        run: |
          # The browser suites need a `chromium`/`google-chrome` binary. GH
          # runners ship Chrome; we wrap it to inject container-safe flags.
          CHROME_BIN="$(readlink -f "$(which google-chrome || which chromium || which chromium-browser)")"
          echo "Chrome at: $CHROME_BIN"
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/chromium" <<EOF
          #!/bin/bash
          exec "$CHROME_BIN" --no-sandbox --disable-gpu --disable-dev-shm-usage "\$@"
          EOF
          chmod +x "$HOME/.local/bin/chromium"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The browser and visual-regression suites both drive this binary
          # via Playwright; CHROME_BIN is what e2e/browser/harness.ts checks first.
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Install SeaweedFS (S3 backend E2E)
        run: |
          # Single static binary — the S3 storage suite spawns a real
          # `weed server -s3` on scratch ports (e2e/s3-seaweed.test.ts).
          WEED_VER="4.47"
          curl -sL "https://github.com/seaweedfs/seaweedfs/releases/download/${WEED_VER}/linux_amd64.tar.gz" -o /tmp/weed.tar.gz
          tar xzf /tmp/weed.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin" && mv /tmp/weed "$HOME/.local/bin/weed" && chmod +x "$HOME/.local/bin/weed"
          "$HOME/.local/bin/weed" version | head -1
          echo "WEED_BIN=$HOME/.local/bin/weed" >> "$GITHUB_ENV"

      - name: Run E2E suite
        run: bash e2e/run.sh

      - name: Upload public home visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-${{ github.sha }}
          path: |
            e2e/baselines/home.FAILED.png
            e2e/baselines/home.png
          if-no-files-found: warn
          retention-days: 2


  # The HTTP/browser tier covers PostgreSQL. Additional provider-independent
  # transaction, mail and migration cases run in release-verification.yml.
  # Suites that deliberately create their own SQLite files remain in e2e.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docurama
          POSTGRES_PASSWORD: docurama
          POSTGRES_DB: docurama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docurama -d docurama_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://docurama:docurama@localhost:5432/docurama_test
      DOCURAMA_ALLOW_PRIVATE_WEBHOOKS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the PostgreSQL schema and client
        run: |
          # scripts/schema-for.mjs rejects non-portable schema constructs.
          node scripts/schema-for.mjs postgresql
          bunx prisma generate --schema prisma/schema.postgresql.prisma
        env:
          DATABASE_URL: ${{ env.PGURL }}

      - name: Apply reviewed migrations to the disposable PostgreSQL database
        run: node node_modules/prisma/build/index.js migrate deploy --schema prisma/postgresql/schema.prisma
        env:
          DATABASE_URL: ${{ env.PGURL }}

      - name: "Smoke: tables exist"
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U docurama -d docurama_test -c "\dt" | tee /dev/stderr | grep -q "Envelope"
          docker exec ${{ job.services.postgres.id }} psql -U docurama -d docurama_test -c "\dt" | grep -q "TransparencyEntry"

      - name: Install Chrome + no-sandbox wrapper
        run: |
          CHROME_BIN="$(readlink -f "$(which google-chrome || which chromium || which chromium-browser)")"
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/chromium" <<EOF
          #!/bin/bash
          exec "$CHROME_BIN" --no-sandbox --disable-gpu --disable-dev-shm-usage "\$@"
          EOF
          chmod +x "$HOME/.local/bin/chromium"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run owned PostgreSQL HTTP and browser lifecycle
        run: node e2e/run-postgres-isolated.mjs
        env:
          DATABASE_URL: ${{ env.PGURL }}
          E2E_DATABASE_URL: ${{ env.PGURL }}
          E2E_REMOTE_DISPOSABLE: "1"
          E2E_BASE_URL: http://127.0.0.1:3000
