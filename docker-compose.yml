services:
  docurama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docurama-enterprise
    restart: always
    ports:
      - "0.0.0.0:3003:3000"
    environment:
      - NODE_ENV=production
      # Values live in the untracked .env next to this file (SMTP_URL,
      # SMTP_FROM, ROOT_DOMAIN) so checkouts/deploys never strand local config.
      - SMTP_URL=${SMTP_URL:-}
      # Optional operator-verified sender; blank inherits platform configuration.
      # SMTP credentials and ROOT_DOMAIN do not select a sending identity.
      - SMTP_FROM=${SMTP_FROM:-}
      - ROOT_DOMAIN=${ROOT_DOMAIN:-}
      - DATABASE_URL=file:/app/db/custom.db
      - STORAGE_DIR=/app/storage
      - NEXT_PUBLIC_DEMO_MODE=false
      - DOCURAMA_DEPLOYMENT_MODE=selfhost
      - DOCURAMA_PUBLIC_REGISTRATION=false
    volumes:
      - ./db:/app/db
      - ./storage:/app/storage
