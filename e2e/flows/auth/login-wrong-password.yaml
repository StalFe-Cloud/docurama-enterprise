# Auth — wrong password must show an inline error and keep the user out.
url: ${MAESTRO_BASE_URL}/login
name: Wrong password shows an inline error
tags:
  - e2e
  - auth
  - negative
---
- launchApp

- extendedWaitUntil:
    visible: Sign in to your portal
    timeout: 30000

- tapOn:
    id: email
- inputText: e2e@docurama.eu
- tapOn:
    id: password
- inputText: "definitely-not-the-password"
- tapOn: " ?Sign in securely ?"

- extendedWaitUntil:
    visible: Invalid email or password
    timeout: 10000

# Still on the sign-in screen
- assertVisible: Sign in to your portal
